<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bigpicture has moved</title>
  <meta http-equiv="refresh" content="10; url=https://portal.bigpicture.eu/">
  <link rel="canonical" href="https://portal.bigpicture.eu/">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico">
  <script>
    var target = "https://portal.bigpicture.eu/";
    var remaining = 10;
    var timer = setInterval(function () {
      remaining -= 1;
      var el = document.getElementById("countdown");
      if (el) {
        el.textContent = remaining + (remaining === 1 ? " second" : " seconds");
      }
      if (remaining <= 0) {
        clearInterval(timer);
        window.location.replace(target);
      }
    }, 1000);
  </script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1rem; line-height: 1.5; color: #222; background: #fff; }
    a { color: #2780e3; }
  </style>
</head>
<body>
  <h1>Bigpicture has moved</h1>
  <p>This site is no longer maintained. Bigpicture is now available at
    <a href="https://portal.bigpicture.eu/">portal.bigpicture.eu</a>.</p>
  <p>You will be redirected automatically in <span id="countdown">10 seconds</span>. If not, please follow the link above.</p>
</body>
</html>
