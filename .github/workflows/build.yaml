name: Publish to Github Pages

on:
  push:
    branches:
    - main

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      contents: write

    steps:
    - name: Checkout files
      uses: actions/checkout@v4

    # The same page is served for every path (via 404.html) so old deep links
    # also end up on the new portal.
    - name: Copy redirect page to 404.html
      run: cp site/index.html site/404.html

    # Replaces the whole gh-pages branch (keep_files defaults to false), so
    # none of the old rendered Quarto pages survive.
    - name: Publish to Github Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: ./site
        force_orphan: true
