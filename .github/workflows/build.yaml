name: Publish to Github Pages

on:
  push:
    branches:
    - main

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      contents: write

    steps:
    - name: Checkout files
      uses: actions/checkout@v4

    # The same page is served for every path (via 404.html) so old deep links
    # also end up on the new portal.
    - name: Copy redirect page to 404.html
      run: cp site/index.html site/404.html

    # Replaces all files on gh-pages with the contents of site/ (as a normal
    # commit, no force push), so none of the old rendered Quarto pages survive.
    - name: Publish to Github Pages
      run: |
        git fetch origin gh-pages
        git worktree add pages origin/gh-pages
        cd pages
        git rm -rq --ignore-unmatch .
        cp -a ../site/. .
        git add -A
        git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Publish redirect to portal.bigpicture.eu" || exit 0
        git push origin HEAD:gh-pages
